<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV | Boyang Zhou</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #eef8ff;
        color: #102a43;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .cv-page {
        display: grid;
        height: 100%;
        grid-template-rows: 48px minmax(0, 1fr);
      }

      .cv-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-inline: 16px;
        border-bottom: 1px solid rgba(0, 119, 182, 0.16);
        background: #f8fbff;
        box-shadow: 0 4px 18px rgba(16, 42, 67, 0.08);
      }

      .home-link {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 6px;
        transition: background 160ms ease;
      }

      .home-link:hover {
        background: rgba(0, 119, 182, 0.1);
      }

      .home-link img {
        width: 24px;
        height: 24px;
      }

      .cv-toolbar strong {
        font-size: 16px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="cv-page">
      <header class="cv-toolbar">
        <a class="home-link" href="index.html#home" aria-label="Return to homepage" title="Return to homepage">
          <img src="assets/favicon.svg" alt="">
        </a>
        <strong>CV</strong>
      </header>
      <iframe src="assets/Boyang_Zhou_CV.pdf" title="Boyang Zhou CV"></iframe>
    </main>
  </body>
</html>
